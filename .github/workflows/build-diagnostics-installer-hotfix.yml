name: Build diagnostics installer hotfix

on:
  push:
    branches:
      - fix/post-update-diagnostics-2026-08-02-3
    paths:
      - ".github/workflows/build-diagnostics-installer-hotfix.yml"
      - "tools/system-updates/build_2026_08_02_3.py"
  pull_request:
    paths:
      - ".github/workflows/build-diagnostics-installer-hotfix.yml"
      - "tools/system-updates/build_2026_08_02_3.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/post-update-diagnostics-2026-08-02-3

      - name: Build corrected installer
        run: |
          python3 tools/system-updates/build_2026_08_02_3.py
          php -l updates/installers/2026.08.02.3.php

      - name: Commit generated installer files
        run: |
          set -euo pipefail
          git config user.name "diagnostics-hotfix-bot"
          git config user.email "diagnostics-hotfix-bot@users.noreply.github.com"
          git add \
            updates/installers/2026.08.02.3.php \
            updates/release.json \
            updates/manifest.json \
            tools/system-updates/2026.08.02.3/checksums.txt
          git commit -m "Fix post-update diagnostics installer runtime interpolation"
          git push origin HEAD:fix/post-update-diagnostics-2026-08-02-3

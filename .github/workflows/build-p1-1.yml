name: Build P1.1 sales module

on:
  push:
    branches:
      - main
    paths:
      - "tools/p1-step1/**"
      - "tools/system-updates/build_p1_1.py"
      - ".github/workflows/build-p1-1.yml"

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql php-xml mysql-client
          php -m | grep -q pdo_mysql
          php -m | grep -q SimpleXML

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/system-updates/build_p1_1.py
          php -l updates/installers/2026.08.02.11.php
          grep -q 'P1_SALES_V180211' updates/installers/2026.08.02.11.php

      - name: Build portal fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p11/data/www/seo-test.mirsaitov.pw
          mkdir -p \
            "$root/app/Core" \
            "$root/app/Repositories" \
            "$root/app/Services" \
            "$root/assets" \
            "$root/sql" \
            "$root/storage/backups"

          cat > "$root/index.php" <<'PHP'
          <?php declare(strict_types=1); ?>
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><link rel="stylesheet" href="/assets/app.css?v=1"></head>
          <body><nav><button class="nav-link" data-section="reports"><span>Отчёты</span></button></nav><main></main><script src="/assets/app.js?v=1"></script></body>
          </html>
          PHP
          printf 'window.showSection = () => {};\n' > "$root/assets/app.js"
          printf ':root { --line: #ddd; --text: #111; --muted: #667; }\n' > "$root/assets/app.css"
          printf '%s\n' '-- base schema' > "$root/sql/schema.sql"

          cat > "$root/app/bootstrap.php" <<'PHP'
          <?php
          declare(strict_types=1);
          spl_autoload_register(static function (string $class): void {
              $prefix = 'SeoAnalytics\\';
              if (!str_starts_with($class, $prefix)) return;
              $relative = str_replace('\\', '/', substr($class, strlen($prefix)));
              $path = __DIR__ . '/' . $relative . '.php';
              if (is_file($path)) require_once $path;
          });
          PHP

          cat > "$root/app/Core/Database.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Core;
          final class Database
          {
              public static function pdo(): \PDO
              {
                  static $pdo;
                  if (!$pdo instanceof \PDO) {
                      $pdo = new \PDO(
                          'mysql:host=127.0.0.1;port=3306;dbname=portal;charset=utf8mb4',
                          'root',
                          'root',
                          [\PDO::ATTR_ERRMODE => \PDO::ERRMODE_EXCEPTION]
                      );
                  }
                  return $pdo;
              }
          }
          PHP

          cat > "$root/app/Services/PortalAccessService.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Services;
          final class PortalAccessService
          {
              public function requireRoles(array $roles): array
              {
                  return ['id' => 1, 'role' => 'administrator'];
              }
          }
          PHP

          cat > "$root/app/Repositories/ProjectRepository.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Repositories;
          final class ProjectRepository
          {
              public function firstActive(): ?array
              {
                  return ['id' => 1, 'name' => 'Тестовый проект'];
              }
          }
          PHP

          mysql -h127.0.0.1 -uroot -proot portal <<'SQL'
          CREATE TABLE users (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              email VARCHAR(190) NOT NULL,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE projects (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              active TINYINT(1) NOT NULL DEFAULT 1,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT INTO users (name, email) VALUES ('Admin', 'admin@example.test');
          INSERT INTO projects (name, active) VALUES ('Тестовый проект', 1);
          SQL

      - name: Install P1.1
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p11/data/www/seo-test.mirsaitov.pw
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.11.php")

          test -f "$root/app/Repositories/SalesRepository.php"
          test -f "$root/app/Services/SalesImportService.php"
          test -f "$root/app/Services/ZipArchivePolyfill.php"
          test -f "$root/p1-api.php"
          test -f "$root/assets/p1-sales.js"
          test -f "$root/assets/p1-sales.css"
          grep -q 'P1_SALES_ASSETS_V180211' "$root/index.php"
          grep -q 'P1_SALES_SCHEMA_V180211' "$root/sql/schema.sql"
          grep -q 'actionParts' "$root/assets/p1-sales.js"
          test "$(grep -c '/assets/p1-sales.js?v=180211' "$root/index.php")" -eq 1
          test "$(grep -c '/assets/p1-sales.css?v=180211' "$root/index.php")" -eq 1

          php -l "$root/app/Repositories/SalesRepository.php"
          php -l "$root/app/Services/SalesImportService.php"
          php -l "$root/app/Services/ZipArchivePolyfill.php"
          php -l "$root/p1-api.php"
          php -l "$root/index.php"

          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'sales_records'" | grep -q sales_records
          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'sales_import_batches'" | grep -q sales_import_batches

      - name: Test manual records and CSV import
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p11/data/www/seo-test.mirsaitov.pw
          cat > /tmp/p11-sales.csv <<'CSV'
          Дата;ID сделки;Канал;Клиент;Статус;Сумма договора;Оплачено;Маржа %;Квалифицированный;Договор;Комментарий
          2026-08-01;CSV-1;Яндекс Директ;ООО Альфа;Оплачено;120000;90000;30;Да;Да;Первая строка
          02.08.2026;CSV-2;SEO;ООО Бета;Квалифицирован;0;0;;Да;Нет;Вторая строка
          CSV

          cat > /tmp/p11-test.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = '/tmp/p11/data/www/seo-test.mirsaitov.pw';
          require $root . '/app/bootstrap.php';
          require_once $root . '/app/Repositories/SalesRepository.php';
          require_once $root . '/app/Services/ZipArchivePolyfill.php';
          require_once $root . '/app/Services/SalesImportService.php';

          $repository = new SeoAnalytics\Repositories\SalesRepository();
          $manualId = $repository->save([
              'occurred_at' => '2026-08-02',
              'channel_key' => 'vk',
              'customer_name' => 'ООО Ручной ввод',
              'external_id' => 'MANUAL-1',
              'status' => 'contract',
              'contract_amount' => 200000,
              'paid_amount' => 50000,
              'gross_margin_percent' => 40,
              'qualified' => true,
              'contract' => true,
          ], 1, 1);
          if ($manualId <= 0) throw new RuntimeException('Manual save failed');

          $service = new SeoAnalytics\Services\SalesImportService();
          $parsed = $service->parseUpload([
              'error' => UPLOAD_ERR_OK,
              'tmp_name' => '/tmp/p11-sales.csv',
              'name' => 'sales.csv',
              'size' => filesize('/tmp/p11-sales.csv'),
          ]);
          if (count($parsed['rows']) !== 2) throw new RuntimeException('CSV parse failed');
          $first = $repository->import($parsed['rows'], $parsed, 1, 1);
          if ($first['rows_imported'] !== 2) throw new RuntimeException('CSV import failed');
          $second = $repository->import($parsed['rows'], $parsed, 1, 1);
          if ($second['rows_skipped'] !== 2) throw new RuntimeException('Duplicate protection failed');

          $summary = $repository->summary(1, '2026-08-01', '2026-08-31');
          if ($summary['records_count'] !== 3) throw new RuntimeException('Wrong record count');
          if ($summary['qualified_count'] !== 3) throw new RuntimeException('Wrong qualified count');
          if ($summary['contracts_count'] !== 2) throw new RuntimeException('Wrong contract count');
          if ((float) $summary['contract_amount'] !== 320000.0) throw new RuntimeException('Wrong amount');
          if ((float) $summary['paid_amount'] !== 140000.0) throw new RuntimeException('Wrong paid amount');
          PHP
          php /tmp/p11-test.php

      - name: Test XLSX import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          rows = [
              ['Дата', 'ID сделки', 'Канал', 'Клиент', 'Статус', 'Сумма договора', 'Оплачено', 'Маржа %', 'Квалифицированный', 'Договор', 'Комментарий'],
              ['2026-08-03', 'XLSX-1', 'Авито', 'ООО Гамма', 'Договор', '80000', '0', '25', 'Да', 'Да', 'XLSX строка'],
          ]
          def col(index: int) -> str:
              result = ''
              index += 1
              while index:
                  index, remainder = divmod(index - 1, 26)
                  result = chr(65 + remainder) + result
              return result

          xml_rows = []
          for row_index, row in enumerate(rows, 1):
              cells = []
              for column_index, value in enumerate(row):
                  ref = f'{col(column_index)}{row_index}'
                  escaped = (str(value).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;'))
                  cells.append(f'<c r="{ref}" t="inlineStr"><is><t>{escaped}</t></is></c>')
              xml_rows.append(f'<row r="{row_index}">{"".join(cells)}</row>')
          sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' \
              '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' \
              f'<sheetData>{"".join(xml_rows)}</sheetData></worksheet>'
          with ZipFile('/tmp/p11-sales.xlsx', 'w', ZIP_DEFLATED) as archive:
              archive.writestr('xl/worksheets/sheet1.xml', sheet)
          PY

          cat > /tmp/p11-xlsx.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = '/tmp/p11/data/www/seo-test.mirsaitov.pw';
          require $root . '/app/bootstrap.php';
          require_once $root . '/app/Repositories/SalesRepository.php';
          require_once $root . '/app/Services/ZipArchivePolyfill.php';
          require_once $root . '/app/Services/SalesImportService.php';
          $service = new SeoAnalytics\Services\SalesImportService();
          $parsed = $service->parseUpload([
              'error' => UPLOAD_ERR_OK,
              'tmp_name' => '/tmp/p11-sales.xlsx',
              'name' => 'sales.xlsx',
              'size' => filesize('/tmp/p11-sales.xlsx'),
          ]);
          if (count($parsed['rows']) !== 1) throw new RuntimeException('XLSX parse failed');
          $repository = new SeoAnalytics\Repositories\SalesRepository();
          $result = $repository->import($parsed['rows'], $parsed, 1, 1);
          if ($result['rows_imported'] !== 1) throw new RuntimeException('XLSX import failed');
          $summary = $repository->summary(1, '2026-08-01', '2026-08-31');
          if ($summary['records_count'] !== 4) throw new RuntimeException('XLSX record count failed');
          PHP
          php /tmp/p11-xlsx.php

      - name: Verify repeat installation
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p11/data/www/seo-test.mirsaitov.pw
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.11.php")
          test "$(grep -c '/assets/p1-sales.js?v=180211' "$root/index.php")" -eq 1
          test "$(grep -c 'P1_SALES_SCHEMA_V180211' "$root/sql/schema.sql")" -eq 1
          count="$(mysql -N -h127.0.0.1 -uroot -proot portal -e 'SELECT COUNT(*) FROM sales_records')"
          test "$count" -eq 4

      - name: Commit generated installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add updates/installers/2026.08.02.11.php
          if git diff --cached --quiet; then
            echo "Installer is already current."
            exit 0
          fi
          git commit -m "Build and validate P1.1 sales module"
          git push

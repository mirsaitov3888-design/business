name: Fix P0.5 validation

on:
  push:
    branches:
      - main
    paths:
      - "tools/system-updates/fix_p05_validation.py"
      - ".github/workflows/fix-p0-5-validation.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/system-updates/fix_p05_validation.py

      - name: Commit corrected workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add .github/workflows/validate-p0-5.yml
          if git diff --cached --quiet; then
            echo "Validation workflow is already current."
            exit 0
          fi
          git commit -m "Fix P0.5 validation fixture bootstrap"
          git push

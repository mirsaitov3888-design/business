name: Publish P0.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-p0-3.yml"
  pull_request:

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PHP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client
          php -m | grep -q pdo_mysql
          php -l updates/installers/2026.08.02.8.php

      - name: Build portal fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p03-portal
          mkdir -p "$root/app/Services" "$root/bin" "$root/sql" "$root/storage/backups"

          cat > "$root/app/bootstrap.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Core;

          final class Database
          {
              public static function pdo(): \PDO
              {
                  static $pdo;
                  if (!$pdo instanceof \PDO) {
                      $pdo = new \PDO(
                          'mysql:host=127.0.0.1;port=3306;dbname=portal;charset=utf8mb4',
                          'root',
                          'root',
                          [\PDO::ATTR_ERRMODE => \PDO::ERRMODE_EXCEPTION]
                      );
                  }
                  return $pdo;
              }
          }
          PHP

          cat > "$root/app/Services/LegacyAccess.php" <<'PHP'
          <?php
          declare(strict_types=1);
          final class LegacyAccess
          {
              public function labels(): array
              {
                  return [
                      'admin' => 'Администратор',
                      'analyst' => 'Аналитик',
                      'viewer' => 'Наблюдатель',
                  ];
              }
          }
          PHP

          cat > "$root/api.php" <<'PHP'
          <?php
          $allowed = ['admin', 'analyst'];
          PHP

          cat > "$root/index.php" <<'PHP'
          <?php
          $defaultRole = 'viewer';
          PHP

          cat > "$root/bin/check_roles.php" <<'PHP'
          <?php
          $role = 'admin';
          PHP

          cat > "$root/sql/schema.sql" <<'SQL'
          CREATE TABLE users (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              email VARCHAR(190) NOT NULL,
              role ENUM('admin','analyst','viewer','administrator','moderator','manager','client') NOT NULL DEFAULT 'admin',
              account_status VARCHAR(30) NOT NULL DEFAULT 'active',
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          SQL

          mysql -h127.0.0.1 -uroot -proot portal <<'SQL'
          DROP TABLE IF EXISTS users;
          CREATE TABLE users (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              email VARCHAR(190) NOT NULL,
              role ENUM('admin','analyst','viewer','administrator','moderator','manager','client') NOT NULL DEFAULT 'admin',
              account_status VARCHAR(30) NOT NULL DEFAULT 'active',
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT INTO users (email, role) VALUES
              ('admin@example.test', 'admin'),
              ('analyst@example.test', 'analyst'),
              ('viewer@example.test', 'viewer'),
              ('moderator@example.test', 'moderator');
          SQL

      - name: Run installer twice
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p03-portal
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.8.php")

          type="$(mysql -N -h127.0.0.1 -uroot -proot portal -e "SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='portal' AND TABLE_NAME='users' AND COLUMN_NAME='role'")"
          test "$type" = "enum('administrator','moderator','manager','client')"

          mysql -N -h127.0.0.1 -uroot -proot portal -e "SELECT role, COUNT(*) FROM users GROUP BY role ORDER BY role" > /tmp/p03-role-counts.txt
          grep -q $'administrator\t1' /tmp/p03-role-counts.txt
          grep -q $'client\t1' /tmp/p03-role-counts.txt
          grep -q $'manager\t1' /tmp/p03-role-counts.txt
          grep -q $'moderator\t1' /tmp/p03-role-counts.txt

          ! grep -R -n -E "['\"](admin|analyst|viewer)['\"]" "$root/app" "$root/bin" "$root/api.php" "$root/index.php"
          grep -q "ENUM('administrator','moderator','manager','client') NOT NULL DEFAULT 'client'" "$root/sql/schema.sql"
          php -l "$root/app/Services/LegacyAccess.php"
          php -l "$root/api.php"
          php -l "$root/index.php"
          php -l "$root/bin/check_roles.php"
          test -n "$(find "$root/storage/system-audits" -type f -name 'roles-final-*.json' -print -quit)"

          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.8.php")

      - name: Publish stable manifest
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.02.8.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Заменены оставшиеся проверки admin, analyst и viewer в рабочем коде портала",
              "После замены выполняется повторный аудит и установка останавливается при любом остатке",
              "users.role ограничен четырьмя ролями: administrator, moderator, manager и client",
              "Роль по умолчанию для нового пользователя изменена на client",
              "Обновлена схема базы данных для новых установок",
              "Перед изменениями создаются резервная копия файлов и полная копия таблицы users",
              "При ошибке восстанавливаются файлы и расширенный enum ролей",
              "Результат миграции сохраняется в storage/system-audits",
          ]
          release = {
              "version": "2026.08.02.8",
              "title": "P0.3 — окончательная нормализация ролей",
              "released_at": "2026-08-02",
              "installer_path": "updates/installers/2026.08.02.8.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.02.8.php",
                  "sha256": sha,
              },
          }
          Path('updates/release.json').write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('updates/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'installer_sha256={sha}')
          PY

      - name: Commit release
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add updates/release.json updates/manifest.json
          git commit -m "Publish P0.3 final role normalization"
          git push

# Publish trigger after successful PR validation: 2026-08-02T09:57:00Z

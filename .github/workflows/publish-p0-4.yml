name: Publish P0.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-p0-4.yml"
  pull_request:

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l updates/installers/2026.08.02.9.php
          grep -q "minimum_to_keep' => 10" updates/installers/2026.08.02.9.php
          grep -q "delete_only_after_days' => 45" updates/installers/2026.08.02.9.php
          grep -q "minimum_to_keep' => 3" updates/installers/2026.08.02.9.php
          grep -q "delete_only_after_days' => 14" updates/installers/2026.08.02.9.php
          grep -q "is_link" updates/installers/2026.08.02.9.php
          grep -q "retention-latest.json" updates/installers/2026.08.02.9.php

      - name: Build retention fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p04/data/www/seo-test.mirsaitov.pw
          data=/tmp/p04/data
          mkdir -p \
            "$root/app" \
            "$root/bin" \
            "$root/storage/backups" \
            "$root/storage/system-audits" \
            "$data/system-update-backups" \
            "$data/mirsaitov-diagnostics" \
            "$data/www"

          for i in $(seq -w 1 12); do
            printf 'backup-%s\n' "$i" > "$data/system-update-backups/backup-$i.tar.gz"
          done
          touch -d '60 days ago' \
            "$data/system-update-backups/backup-11.tar.gz" \
            "$data/system-update-backups/backup-12.tar.gz"

          for i in $(seq -w 1 5); do
            mkdir -p "$root/storage/backups/module-2026080${i}-010101"
            printf 'app-%s\n' "$i" > "$root/storage/backups/module-2026080${i}-010101/file.txt"
          done
          touch -d '60 days ago' \
            "$root/storage/backups/module-20260804-010101" \
            "$root/storage/backups/module-20260805-010101"

          for i in $(seq -w 1 5); do
            mkdir -p "$data/www/seo-test.mirsaitov.pw.failed-update-$i"
            printf 'failed-%s\n' "$i" > "$data/www/seo-test.mirsaitov.pw.failed-update-$i/state.txt"
          done
          touch -d '20 days ago' \
            "$data/www/seo-test.mirsaitov.pw.failed-update-4" \
            "$data/www/seo-test.mirsaitov.pw.failed-update-5"

          for i in $(seq -w 1 102); do
            printf '{"report":%s}\n' "$i" > "$data/mirsaitov-diagnostics/report-$i.json"
          done
          touch -d '200 days ago' \
            "$data/mirsaitov-diagnostics/report-101.json" \
            "$data/mirsaitov-diagnostics/report-102.json"
          printf '{}\n' > "$data/mirsaitov-diagnostics/latest.json"
          ln -s "$data/mirsaitov-diagnostics/latest.json" "$data/mirsaitov-diagnostics/report-symlink.json"

          for i in $(seq -w 1 52); do
            printf '{"audit":%s}\n' "$i" > "$root/storage/system-audits/audit-$i.json"
          done
          touch -d '200 days ago' \
            "$root/storage/system-audits/audit-51.json" \
            "$root/storage/system-audits/audit-52.json"

          truncate -s 21M "$data/site-monitor-worker.log"
          printf 'update log\n' > "$data/system-update-worker.log"

      - name: Run installer and verify policy
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p04/data/www/seo-test.mirsaitov.pw
          data=/tmp/p04/data

          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.9.php")

          test -f "$root/app/Services/SystemRetentionService.php"
          test -f "$root/bin/system_retention.php"
          php -l "$root/app/Services/SystemRetentionService.php"
          php -l "$root/bin/system_retention.php"

          test ! -e "$data/system-update-backups/backup-11.tar.gz"
          test ! -e "$data/system-update-backups/backup-12.tar.gz"
          test -e "$data/system-update-backups/backup-10.tar.gz"

          test ! -e "$root/storage/backups/module-20260804-010101"
          test ! -e "$root/storage/backups/module-20260805-010101"
          test -e "$root/storage/backups/module-20260803-010101"

          test ! -e "$data/www/seo-test.mirsaitov.pw.failed-update-4"
          test ! -e "$data/www/seo-test.mirsaitov.pw.failed-update-5"
          test -e "$data/www/seo-test.mirsaitov.pw.failed-update-3"

          test ! -e "$data/mirsaitov-diagnostics/report-101.json"
          test ! -e "$data/mirsaitov-diagnostics/report-102.json"
          test -e "$data/mirsaitov-diagnostics/report-100.json"
          test -L "$data/mirsaitov-diagnostics/report-symlink.json"
          test -e "$data/mirsaitov-diagnostics/latest.json"

          test ! -e "$root/storage/system-audits/audit-51.json"
          test ! -e "$root/storage/system-audits/audit-52.json"
          test -e "$root/storage/system-audits/audit-50.json"
          test -e "$root/storage/system-audits/retention-latest.json"

          test "$(stat -c%s "$data/site-monitor-worker.log")" -eq 0
          test -n "$(find "$data" -maxdepth 1 -type f -name 'site-monitor-worker.log.*.log' -print -quit)"

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/p04/data/www/seo-test.mirsaitov.pw/storage/system-audits/retention-latest.json').read_text(encoding='utf-8'))
          assert report['dry_run'] is False
          assert report['counts']['deleted'] >= 10
          assert report['counts']['rotated'] >= 1
          assert report['counts']['bytes_released'] > 0
          assert report['policy']['failed_updates']['minimum_to_keep'] == 3
          assert report['policy']['failed_updates']['delete_only_after_days'] == 14
          PY

          (cd "$root" && php bin/system_retention.php --dry-run >/tmp/p04-dry-run.json)
          python3 -m json.tool /tmp/p04-dry-run.json >/dev/null

          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.9.php")
          test -e "$data/system-update-backups/backup-10.tar.gz"
          test -e "$data/www/seo-test.mirsaitov.pw.failed-update-3"

      - name: Publish stable manifest
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.02.9.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Добавлена единая безопасная политика хранения резервных копий, неудачных обновлений, диагностических отчётов, аудитов и логов",
              "Системные резервные копии удаляются только старше 45 дней и только сверх десяти последних",
              "Резервные копии приложения удаляются только старше 45 дней и только сверх трёх последних в каждой категории",
              "Failed-update-каталоги удаляются только старше 14 дней и только сверх трёх последних",
              "Диагностические отчёты и аудиты сохраняются не менее 180 дней с минимальным количеством исторических файлов",
              "Логи ротируются только после достижения 20 МБ; сохраняются последние архивы",
              "Символические ссылки и пути вне разрешённых каталогов никогда не удаляются",
              "Каждый запуск сохраняет подробный JSON-отчёт retention-latest.json",
              "Добавлен ежедневный фоновый запуск при наличии crontab и безопасный CLI-режим --dry-run",
          ]
          release = {
              "version": "2026.08.02.9",
              "title": "P0.4 — безопасная политика хранения и очистки",
              "released_at": "2026-08-02",
              "installer_path": "updates/installers/2026.08.02.9.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.02.9.php",
                  "sha256": sha,
              },
          }
          Path('updates/release.json').write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('updates/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'installer_sha256={sha}')
          PY

      - name: Commit release
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add updates/release.json updates/manifest.json
          git commit -m "Publish P0.4 retention policy"
          git push

name: Publish P1.1 hotfix

on:
  push:
    branches:
      - main
    paths:
      - "tools/system-updates/build_p1_1_hotfix.py"
      - ".github/workflows/publish-p1-1-hotfix.yml"

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql php-xml mysql-client
          php -m | grep -q pdo_mysql
          php -m | grep -q SimpleXML

      - name: Build hotfix installer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/system-updates/build_p1_1_hotfix.py
          php -l updates/installers/2026.08.02.12.php
          grep -q "const P11_VERSION = '2026.08.02.12'" updates/installers/2026.08.02.12.php
          grep -q 'P1_SALES_BUNDLED_V180212' updates/installers/2026.08.02.12.php
          ! grep -q 'Не удалось подключить стили P1.1' updates/installers/2026.08.02.12.php

      - name: Build current-layout fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p1112/data/www/seo-test.mirsaitov.pw
          mkdir -p "$root/app/Core" "$root/app/Repositories" "$root/app/Services" "$root/assets" "$root/sql" "$root/storage/backups"

          cat > "$root/index.php" <<'PHP'
          <?php declare(strict_types=1); ?>
          <main id="portal-root"></main>
          PHP
          printf 'window.showSection = () => {};\n' > "$root/assets/app.js"
          printf ':root { --line: #ddd; --text: #111; --muted: #667; }\n' > "$root/assets/app.css"
          printf '%s\n' '-- base schema' > "$root/sql/schema.sql"
          sha256sum "$root/index.php" | cut -d' ' -f1 > /tmp/p1112-index.sha

          cat > "$root/app/bootstrap.php" <<'PHP'
          <?php
          declare(strict_types=1);
          spl_autoload_register(static function (string $class): void {
              $prefix = 'SeoAnalytics\\';
              if (!str_starts_with($class, $prefix)) return;
              $relative = str_replace('\\', '/', substr($class, strlen($prefix)));
              $path = __DIR__ . '/' . $relative . '.php';
              if (is_file($path)) require_once $path;
          });
          PHP

          cat > "$root/app/Core/Database.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Core;
          final class Database
          {
              public static function pdo(): \PDO
              {
                  static $pdo;
                  if (!$pdo instanceof \PDO) {
                      $pdo = new \PDO(
                          'mysql:host=127.0.0.1;port=3306;dbname=portal;charset=utf8mb4',
                          'root',
                          'root',
                          [\PDO::ATTR_ERRMODE => \PDO::ERRMODE_EXCEPTION]
                      );
                  }
                  return $pdo;
              }
          }
          PHP

          cat > "$root/app/Services/PortalAccessService.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Services;
          final class PortalAccessService
          {
              public function requireRoles(array $roles): array
              {
                  return ['id' => 1, 'role' => 'administrator'];
              }
          }
          PHP

          cat > "$root/app/Repositories/ProjectRepository.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Repositories;
          final class ProjectRepository
          {
              public function firstActive(): ?array
              {
                  return ['id' => 1, 'name' => 'Тестовый проект'];
              }
          }
          PHP

          mysql -h127.0.0.1 -uroot -proot portal <<'SQL'
          CREATE TABLE users (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              email VARCHAR(190) NOT NULL,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE projects (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              active TINYINT(1) NOT NULL DEFAULT 1,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT INTO users (name, email) VALUES ('Admin', 'admin@example.test');
          INSERT INTO projects (name, active) VALUES ('Тестовый проект', 1);
          SQL

      - name: Install hotfix twice
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p1112/data/www/seo-test.mirsaitov.pw
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.12.php")
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.12.php")

          test "$(sha256sum "$root/index.php" | cut -d' ' -f1)" = "$(cat /tmp/p1112-index.sha)"
          test "$(grep -c 'P1_SALES_BUNDLED_V180212' "$root/assets/app.css")" -eq 1
          test "$(grep -c 'P1_SALES_BUNDLED_V180212' "$root/assets/app.js")" -eq 1
          grep -q 'P1_SALES_V180211' "$root/assets/app.css"
          grep -q 'P1_SALES_V180211' "$root/assets/app.js"
          grep -q 'actionParts' "$root/assets/app.js"
          test -f "$root/app/Repositories/SalesRepository.php"
          test -f "$root/app/Services/SalesImportService.php"
          test -f "$root/app/Services/ZipArchivePolyfill.php"
          test -f "$root/p1-api.php"
          grep -q 'P1_SALES_SCHEMA_V180211' "$root/sql/schema.sql"
          php -l "$root/app/Repositories/SalesRepository.php"
          php -l "$root/app/Services/SalesImportService.php"
          php -l "$root/app/Services/ZipArchivePolyfill.php"
          php -l "$root/p1-api.php"
          php -l "$root/index.php"
          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'sales_records'" | grep -q sales_records
          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'sales_import_batches'" | grep -q sales_import_batches

      - name: Test sales data and CSV import
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p1112/data/www/seo-test.mirsaitov.pw
          cat > /tmp/p1112-sales.csv <<'CSV'
          Дата;ID сделки;Канал;Клиент;Статус;Сумма договора;Оплачено;Маржа %;Квалифицированный;Договор;Комментарий
          2026-08-01;CSV-1;Яндекс Директ;ООО Альфа;Оплачено;120000;90000;30;Да;Да;Первая строка
          CSV
          cat > /tmp/p1112-test.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = '/tmp/p1112/data/www/seo-test.mirsaitov.pw';
          require $root . '/app/bootstrap.php';
          require_once $root . '/app/Repositories/SalesRepository.php';
          require_once $root . '/app/Services/ZipArchivePolyfill.php';
          require_once $root . '/app/Services/SalesImportService.php';
          $repository = new SeoAnalytics\Repositories\SalesRepository();
          $manualId = $repository->save([
              'occurred_at' => '2026-08-02',
              'channel_key' => 'vk',
              'customer_name' => 'ООО Ручной ввод',
              'external_id' => 'MANUAL-1',
              'status' => 'contract',
              'contract_amount' => 200000,
              'paid_amount' => 50000,
              'gross_margin_percent' => 40,
              'qualified' => true,
              'contract' => true,
          ], 1, 1);
          if ($manualId <= 0) throw new RuntimeException('Manual save failed');
          $service = new SeoAnalytics\Services\SalesImportService();
          $parsed = $service->parseUpload([
              'error' => UPLOAD_ERR_OK,
              'tmp_name' => '/tmp/p1112-sales.csv',
              'name' => 'sales.csv',
              'size' => filesize('/tmp/p1112-sales.csv'),
          ]);
          $first = $repository->import($parsed['rows'], $parsed, 1, 1);
          if ($first['rows_imported'] !== 1) throw new RuntimeException('CSV import failed');
          $second = $repository->import($parsed['rows'], $parsed, 1, 1);
          if ($second['rows_skipped'] !== 1) throw new RuntimeException('Duplicate protection failed');
          $summary = $repository->summary(1, '2026-08-01', '2026-08-31');
          if ($summary['records_count'] !== 2) throw new RuntimeException('Wrong record count');
          if ((float) $summary['paid_amount'] !== 140000.0) throw new RuntimeException('Wrong paid amount');
          PHP
          php /tmp/p1112-test.php

      - name: Publish stable manifest
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.02.12.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Исправлено подключение интерфейса P1.1 на текущей структуре портала",
              "Установщик больше не ищет теги head и body и не изменяет index.php",
              "Стили и JavaScript безопасно добавляются в уже подключённые assets/app.css и assets/app.js",
              "Повторный запуск не дублирует CSS и JavaScript",
              "При ошибке основные ресурсы полностью восстанавливаются из резервной копии",
              "Сохранены ручной ввод сделок, CSV/XLSX, защита от дублей, сводка и история импортов",
          ]
          release = {
              "version": "2026.08.02.12",
              "title": "P1.1 — исправление подключения раздела продаж",
              "released_at": "2026-08-02",
              "installer_path": "updates/installers/2026.08.02.12.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.02.12.php",
                  "sha256": sha,
              },
          }
          Path('updates/release.json').write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('updates/manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'installer_sha256={sha}')
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add updates/installers/2026.08.02.12.php updates/release.json updates/manifest.json
          git commit -m "Publish P1.1 interface hotfix"
          git push

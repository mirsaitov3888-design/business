name: Publish P1.1 sales module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-p1-1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate generated installer
        shell: bash
        run: |
          set -euo pipefail
          php -l updates/installers/2026.08.02.11.php
          grep -q "P11_VERSION = '2026.08.02.11'" updates/installers/2026.08.02.11.php
          grep -q 'P1_SALES_V180211' updates/installers/2026.08.02.11.php
          grep -q 'sales_records' updates/installers/2026.08.02.11.php
          grep -q 'sales_import_batches' updates/installers/2026.08.02.11.php
          grep -q 'p1-sales.js?v=180211' updates/installers/2026.08.02.11.php
          grep -q 'p1-sales.css?v=180211' updates/installers/2026.08.02.11.php
          grep -q 'Файлы восстановлены из резервной копии' updates/installers/2026.08.02.11.php

      - name: Publish manifest
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.02.11.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Добавлен отдельный раздел P1 «Продажи и экономика»",
              "Сделки и продажи можно добавлять, редактировать и удалять вручную",
              "Поддерживаются статусы от заявки до оплаты и отказа",
              "Для каждой записи сохраняются канал, клиент, сумма договора, оплата, маржа и квалификация",
              "Добавлен импорт CSV и XLSX размером до 10 МБ и до 5000 строк",
              "Распознаются русские и английские названия колонок, распространённые форматы дат, каналов и статусов",
              "Повторный импорт одинаковых записей безопасно пропускает дубликаты по fingerprint",
              "Добавлены сводные показатели, разбивка по каналам, журнал записей и история импортов",
              "Данные подготовлены как единый источник для следующих расчётов CPQL, стоимости договора, ROAS и ROMI",
              "Раздел доступен администраторам, модераторам и менеджерам; записи защищены проверкой сессии и источника запроса",
              "Установщик создаёт резервную копию, проверяет PHP-синтаксис, восстанавливает файлы и новые таблицы при ошибке",
              "Повторная установка не дублирует подключение ресурсов и сохраняет внесённые данные",
          ]
          release = {
              "version": "2026.08.02.11",
              "title": "P1.1 — продажи, сделки и импорт CSV/XLSX",
              "released_at": "2026-08-02",
              "installer_path": "updates/installers/2026.08.02.11.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.02.11.php",
                  "sha256": sha,
              },
          }
          Path('updates/release.json').write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('updates/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'installer_sha256={sha}')
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add updates/release.json updates/manifest.json
          git commit -m "Publish P1.1 sales and import module"
          git push

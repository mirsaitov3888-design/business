name: Build Bitrix-first client v19 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 38

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client jq
          php -m | grep -q pdo_mysql

      - name: Run full Bitrix-first integration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/bitrix-client-v19/run_ci.sh
          php -l updates/installers/2026.08.03.19.php
          grep -q "const BITRIX_CLIENT_VERSION = '2026.08.03.19'" updates/installers/2026.08.03.19.php
          grep -q 'BITRIX_CLIENT_ONBOARDING_V180319' updates/installers/2026.08.03.19.php
          grep -q 'BITRIX_CLIENT_ONBOARDING_SCHEMA_V180319' updates/installers/2026.08.03.19.php

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.03.19.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Создание и редактирование клиента начинается с выбора компании Bitrix24",
              "Название компании, телефоны и email загружаются из Bitrix24",
              "Контакты выбранной компании загружаются автоматически",
              "Можно выбрать несколько контактных лиц и назначить основной контакт",
              "Можно выбрать несколько проектов или рабочих групп Bitrix24",
              "Рекомендуемые проекты отмечаются по совпадению названия компании и проекта",
              "Для каждого проекта Bitrix24 создаётся или обновляется один локальный проект",
              "Компания, контакты и проекты сохраняются с внешними ID для повторной синхронизации",
              "Повторная синхронизация не создаёт дубли клиентов и проектов",
              "Локальные сайты, счётчики, отчёты и настройки источников не удаляются",
              "Проект Bitrix24, уже связанный с другим клиентом, нельзя перепривязать",
              "Администратор и модератор могут создавать клиентов; менеджер редактирует назначенных",
              "Старая ручная форма сохранена как резервный режим",
              "Параметры API формируются через URLSearchParams и не попадают внутрь action",
              "index.php не изменяется, старый Node.js не вызывает ложный откат",
              "Проверены MySQL 8.4, полный стек .15–.18, двойная установка и повторная синхронизация"
          ]
          release = {
              "version": "2026.08.03.19",
              "title": "Bitrix-first — клиенты, контакты и проекты",
              "released_at": "2026-08-03",
              "installer_path": "updates/installers/2026.08.03.19.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.03.19.php",
                  "sha256": sha,
              },
          }
          Path("updates/release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("updates/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"installer_sha256={sha}")
          PY

      - name: Commit release artifacts to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add \
            updates/installers/2026.08.03.19.php \
            updates/release.json \
            updates/manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "Build Bitrix-first client v19 release artifacts"
          git push origin HEAD:${{ github.head_ref }}

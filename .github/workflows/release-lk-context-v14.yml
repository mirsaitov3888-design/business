name: Build LK context v14 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client
          php -m | grep -q pdo_mysql

      - name: Run full integration and build installer
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lk-context-v14/run_ci.sh
          php -l updates/installers/2026.08.02.14.php
          grep -q "const LK_CONTEXT_VERSION = '2026.08.02.14'" updates/installers/2026.08.02.14.php
          grep -q 'LK_CONTEXT_BUNDLED_V180214' updates/installers/2026.08.02.14.php

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.02.14.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Добавлен единый глобальный контекст клиента и проекта для личного кабинета",
              "Администратор и модератор могут выбирать клиента и проект",
              "Менеджер видит только назначенных ему клиентов и их проекты",
              "Клиент работает внутри своего ЛК, не видит переключатель клиента и выбирает только доступный проект",
              "Последний выбранный проект сохраняется в сессии и восстанавливается после обновления страницы",
              "Каждый project_id повторно проверяется на сервере; подстановка чужого проекта возвращает отказ в доступе",
              "Создан канонический реестр project_sites с поддержкой нескольких сайтов на один проект",
              "Существующие сайты переносятся из projects.site_url, site_monitors и monitored_sites без дублирования",
              "В глобальном фильтре показывается количество сайтов выбранного проекта",
              "Продажи, импорт сделок и классификация целей переведены с первого активного проекта на выбранный проект",
              "Клиентский доступ к сделкам и целям работает в режиме просмотра",
              "Интерфейс подключается через assets/app.css и assets/app.js без изменения index.php",
              "Установщик создаёт резервную копию, проверяет PHP и JavaScript и автоматически откатывается при ошибке",
              "Повторная установка не дублирует ресурсы, сайты и контекст пользователя"
          ]
          release = {
              "version": "2026.08.02.14",
              "title": "ЛК — выбор клиента, проекта и сайтов",
              "released_at": "2026-08-02",
              "installer_path": "updates/installers/2026.08.02.14.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.02.14.php",
                  "sha256": sha,
              },
          }
          Path('updates/release.json').write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('updates/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'installer_sha256={sha}')
          PY

      - name: Commit release artifacts to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add \
            updates/installers/2026.08.02.14.php \
            updates/release.json \
            updates/manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "Build LK context v14 release artifacts"
          git push origin HEAD:${{ github.head_ref }}

name: Build LK context v15 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client
          php -m | grep -q pdo_mysql

      - name: Run old-Node integration and build installer
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lk-context-v15/run_ci.sh
          php -l updates/installers/2026.08.02.15.php
          grep -q "const LK_CONTEXT_VERSION = '2026.08.02.15'" updates/installers/2026.08.02.15.php
          grep -q 'Проверка JavaScript через Node.js пропущена' updates/installers/2026.08.02.15.php
          grep -q 'node -e' updates/installers/2026.08.02.15.php

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.02.15.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Исправлен ложный откат установки на сервере со старой версией Node.js",
              "Перед проверкой JavaScript установщик определяет поддержку optional chaining и nullish coalescing",
              "Совместимая версия Node.js проверяет полный assets/app.js, несовместимая версия больше не считается ошибкой портала",
              "Релиз накопительный и включает весь функционал выбора клиента, проекта и сайтов из версии 2026.08.02.14",
              "Администратор и модератор могут выбирать клиента и проект",
              "Менеджер видит только назначенных ему клиентов и проекты",
              "Клиент работает внутри своего ЛК и выбирает только доступный проект",
              "Сделки и классификация целей работают в контексте выбранного проекта",
              "Создан единый реестр project_sites с поддержкой нескольких сайтов на проект",
              "Существующие сайты переносятся из projects.site_url, site_monitors и monitored_sites без дублирования",
              "Клиентский доступ к сделкам и целям остаётся только для просмотра",
              "index.php не изменяется; установка создаёт резервную копию и автоматически откатывается при ошибке",
              "Повторная установка не дублирует ресурсы, сайты и пользовательский контекст"
          ]
          release = {
              "version": "2026.08.02.15",
              "title": "ЛК — совместимость со старым Node.js",
              "released_at": "2026-08-02",
              "installer_path": "updates/installers/2026.08.02.15.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.02.15.php",
                  "sha256": sha,
              },
          }
          Path('updates/release.json').write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('updates/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'installer_sha256={sha}')
          PY

      - name: Commit release artifacts to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add \
            updates/installers/2026.08.02.15.php \
            updates/release.json \
            updates/manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "Build LK context v15 release artifacts"
          git push origin HEAD:${{ github.head_ref }}

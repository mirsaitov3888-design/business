name: Build LK2 v16 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client
          php -m | grep -q pdo_mysql

      - name: Run full LK2 integration and build installer
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lk2-v16/run_ci.sh
          php -l updates/installers/2026.08.02.16.php
          grep -q "const LK2_VERSION = '2026.08.02.16'" updates/installers/2026.08.02.16.php
          grep -q 'LK2_CLIENT_STRUCTURE_BUNDLED_V180216' updates/installers/2026.08.02.16.php
          grep -q 'LK2_COMPONENT_ROOT' updates/installers/2026.08.02.16.php

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.02.16.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Добавлен полноценный раздел управления клиентами, проектами и сайтами",
              "Карточка клиента содержит контакты, ответственного менеджера и пользователей клиентского кабинета",
              "Администратор и модератор управляют всеми клиентами, менеджер — только назначенными, клиент работает в режиме просмотра",
              "У одного клиента поддерживается несколько проектов с отдельными наборами сайтов",
              "Проекты можно создавать, редактировать, приостанавливать и архивировать",
              "Сайты можно создавать, редактировать, архивировать и сортировать внутри проекта",
              "Для каждого сайта отдельно сохраняются ID Яндекс Метрики и Яндекс Вебмастера",
              "Все данные сохраняются в общей базе и доступны глобальному контексту клиента и проекта",
              "Добавлен журнал изменений клиентов, проектов, сайтов и пользователей кабинета",
              "Установщик адаптируется к накопительной структуре таблицы projects и существующим связям",
              "Существующий пункт «Клиенты» используется повторно, а при его отсутствии создаётся динамически",
              "index.php не изменяется; интерфейс подключается через assets/app.js и assets/app.css",
              "Старый Node.js не вызывает ложный откат, повторная установка не создаёт дубли",
              "Проверены MySQL 8.4, двойная установка, ролевая изоляция, два проекта, три сайта, счётчики, сортировка и архивирование"
          ]
          release = {
              "version": "2026.08.02.16",
              "title": "LK.2 — клиенты, проекты и сайты",
              "released_at": "2026-08-02",
              "installer_path": "updates/installers/2026.08.02.16.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.02.16.php",
                  "sha256": sha,
              },
          }
          Path("updates/release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("updates/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"installer_sha256={sha}")
          PY

      - name: Commit release artifacts to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add \
            updates/installers/2026.08.02.16.php \
            updates/release.json \
            updates/manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "Build LK2 v16 release artifacts"
          git push origin HEAD:${{ github.head_ref }}

name: Build local management v24 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client jq
          php -m | grep -q pdo_mysql

      - name: Run full local management integration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/local-management-v24/run_ci.sh
          php -l updates/installers/2026.08.03.24.php
          grep -q "const LOCAL_MANAGEMENT_VERSION = '2026.08.03.24'" updates/installers/2026.08.03.24.php
          grep -q 'LOCAL_STRUCTURE_MANAGEMENT_V180324' updates/installers/2026.08.03.24.php
          grep -q 'FINANCE_MENU_BOOTSTRAP_V180324' updates/installers/2026.08.03.24.php
          grep -q 'Bitrix24SafetyPolicy' tools/local-management-v24/Bitrix24SafetyPolicy.php

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.03.24.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Пункт «Финансы и экономика» создаётся до первого API-запроса",
              "Ранняя ошибка контекста больше не отключает раздел финансов навсегда",
              "При повторном открытии раздел заново запрашивает выбранный проект",
              "Пункт закрепляется именно в видимом основном меню",
              "Проект можно перенести к другому клиенту только внутри портала",
              "Сайт можно окончательно удалить только из локальной базы портала",
              "Проект и его локальные данные можно окончательно удалить только из портала",
              "Перед удалением требуется ввести точное название сайта или проекта",
              "Перед локальным удалением сохраняется полный JSON-аудит данных",
              "Удаление сайта не меняет поле WEB компании Bitrix24",
              "Удаление проекта не удаляет проект, задачи или компанию в Bitrix24",
              "Вызовы delete/remove/destroy/erase/purge/unlink в Bitrix24 блокируются до HTTP-запроса",
              "Удаляющие команды внутри batch Bitrix24 также блокируются",
              "Разрешённые операции Bitrix24 остаются только чтением, созданием и обновлением",
              "Проверены полный стек до .23, MySQL 8.4, старая Node.js и три установки .24",
              "Проверены перенос проекта, локальное удаление, аудит и запрет удалений Bitrix24"
          ]
          release = {
              "version": "2026.08.03.24",
              "title": "Финансы в меню и локальное управление структурой",
              "released_at": "2026-08-03",
              "installer_path": "updates/installers/2026.08.03.24.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.03.24.php",
                  "sha256": sha,
              },
          }
          Path("updates/release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("updates/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"installer_sha256={sha}")
          PY

      - name: Commit release artifacts to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add \
            updates/installers/2026.08.03.24.php \
            updates/release.json \
            updates/manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "Build local management v24 release artifacts"
          git push origin HEAD:${{ github.head_ref }}

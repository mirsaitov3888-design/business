name: Build navigation state v22 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client jq
          php -m | grep -q pdo_mysql

      - name: Run full navigation integration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/navigation-v22/run_ci.sh
          php -l updates/installers/2026.08.03.22.php
          grep -q "const NAVIGATION_STATE_VERSION = '2026.08.03.22'" updates/installers/2026.08.03.22.php
          grep -q 'PORTAL_NAVIGATION_STATE_V180322' updates/installers/2026.08.03.22.php
          grep -q 'seoAnalytics.activeSection.v22' updates/installers/2026.08.03.22.php

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.03.22.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Текущий раздел сохраняется после обычной перезагрузки страницы",
              "После синхронизации клиента с Bitrix24 портал возвращается в раздел «Клиенты»",
              "Активный раздел хранится в URL и локальном хранилище браузера",
              "Основное меню использует единый реестр доступных разделов",
              "Недостающие динамические пункты меню восстанавливаются автоматически",
              "Дубли пунктов с одинаковым data-section удаляются",
              "Пункт «Продажи и экономика» закреплён и не исчезает при перерисовке меню",
              "Сохраняются исходные DOM-узлы динамических разделов вместе с обработчиками",
              "В заголовке «Проекты Bitrix24» показывается число выбранных проектов в скобках",
              "Счётчик проектов обновляется сразу при выборе или снятии флажка",
              "Версии app.css и app.js обновлены для загрузки нового контроллера",
              "Патч не меняет клиентов, проекты, сайты и другие данные",
              "Проверены полный стек до .21, MySQL 8.4, старая Node.js и три установки .22"
          ]
          release = {
              "version": "2026.08.03.22",
              "title": "Единая навигация и сохранение текущей страницы",
              "released_at": "2026-08-03",
              "installer_path": "updates/installers/2026.08.03.22.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.03.22.php",
                  "sha256": sha,
              },
          }
          Path("updates/release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("updates/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"installer_sha256={sha}")
          PY

      - name: Commit release artifacts to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add \
            updates/installers/2026.08.03.22.php \
            updates/release.json \
            updates/manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "Build navigation state v22 release artifacts"
          git push origin HEAD:${{ github.head_ref }}

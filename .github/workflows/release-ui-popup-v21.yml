name: Build portal popup hotfix v21 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client jq
          php -m | grep -q pdo_mysql

      - name: Run full popup hotfix integration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ui-popup-v21/run_ci.sh
          php -l updates/installers/2026.08.03.21.php
          grep -q "const UI_POPUP_FIX_VERSION = '2026.08.03.21'" updates/installers/2026.08.03.21.php
          grep -q 'PORTAL_UI_POPUP_FIX_V180321' updates/installers/2026.08.03.21.php
          grep -q 'LK2_MODAL_DIRECT_CLOSE_V21' updates/installers/2026.08.03.21.php

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum updates/installers/2026.08.03.21.php | cut -d' ' -f1)"
          python3 - "$sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          changes = [
              "Исправлено растягивание чекбоксов и радиокнопок в Bitrix-first форме",
              "Названия и контактные данные снова отображаются в карточках контактов",
              "Названия и описания проектов Bitrix24 снова отображаются в списке",
              "Убран горизонтальный скролл в списках контактов и проектов",
              "Текст в карточках переносится на несколько строк без обрезки",
              "Исправлено закрытие окна «Добавить проект» при клике по полям",
              "Фоновая команда закрытия выполняется только при прямом клике по затемнённому слою",
              "Крестик и кнопка «Отмена» продолжают закрывать окно",
              "Версии app.css и app.js обновлены для принудительной загрузки исправлений",
              "Патч не меняет клиентов, проекты, сайты и другие данные",
              "Перед изменениями создаётся резервная копия index.php, app.js и app.css",
              "Проверены полный стек до .20, MySQL 8.4, старая Node.js и три последовательные установки .21"
          ]
          release = {
              "version": "2026.08.03.21",
              "title": "Popup hotfix — Bitrix24 и окна проектов",
              "released_at": "2026-08-03",
              "installer_path": "updates/installers/2026.08.03.21.php",
              "changelog": changes,
          }
          manifest = {
              "channel": "stable",
              "latest": {
                  "version": release["version"],
                  "title": release["title"],
                  "released_at": release["released_at"],
                  "changelog": changes,
                  "installer_url": "https://raw.githubusercontent.com/mirsaitov3888-design/business/main/updates/installers/2026.08.03.21.php",
                  "sha256": sha,
              },
          }
          Path("updates/release.json").write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("updates/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"installer_sha256={sha}")
          PY

      - name: Commit release artifacts to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "release-builder"
          git config user.email "release-builder@users.noreply.github.com"
          git add \
            updates/installers/2026.08.03.21.php \
            updates/release.json \
            updates/manifest.json
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "Build portal popup hotfix v21 release artifacts"
          git push origin HEAD:${{ github.head_ref }}

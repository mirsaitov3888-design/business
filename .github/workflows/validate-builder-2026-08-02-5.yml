name: Validate builder 2026.08.02.5

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute builder source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/build-2026-08-02-5.yml').read_text(encoding='utf-8')
          match = re.search(
              r"python3 - <<'PY'\n(.*?)\n          PY\n",
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit('Builder Python block not found')

          code = textwrap.dedent(match.group(1))
          Path('/tmp/build-2026-08-02-5.py').write_text(code, encoding='utf-8')
          PY

          python3 /tmp/build-2026-08-02-5.py
          php -l updates/installers/2026.08.02.5.php

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          installer = Path('updates/installers/2026.08.02.5.php')
          manifest = json.loads(Path('updates/manifest.json').read_text(encoding='utf-8'))
          actual = hashlib.sha256(installer.read_bytes()).hexdigest()
          expected = manifest['latest']['sha256']
          if actual != expected:
              raise SystemExit(f'Manifest mismatch: {actual} != {expected}')
          print(f'installer_sha256={actual}')
          PY

      - name: Run generated installer on fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/portal-fixture-v5-builder
          mkdir -p "$root/app/Services" "$root/assets" "$root/storage/backups"

          cat > "$root/app/Services/SystemUpdateWorker.php" <<'PHP'
          <?php
          /* SYSTEM_UPDATE_DIAGNOSTICS_V180202 */
          PHP

          cat > "$root/app/Services/SystemUpdateService.php" <<'PHP'
          <?php
          declare(strict_types=1);
          final class SystemUpdateServiceFixture
          {
              public function manifest(): array
              {
                  $url = 'https://example.test/manifest.json';
                  $body = $this->download($url, 30, 1024 * 1024);
                  return json_decode($body, true) ?: [];
              }
              private function download(string $url, int $timeout, int $maxBytes): string
              {
                  return '{}';
              }
          }
          PHP

          cat > "$root/index.php" <<'PHP'
          <?php declare(strict_types=1); ?>
          <aside class="sidebar">
              <button class="nav-link" data-section="clients">Клиенты</button>
              <button class="nav-link" data-section="clients">Клиенты</button>
              <button class="nav-link" data-section="reports">Отчёты</button>
              <button class="nav-link" data-section="reports">Отчёты</button>
          </aside>
          <script src="/assets/app.js?v=37"></script>
          PHP

          cat > "$root/assets/app.js" <<'JS'
          function systemUpdatesRenderProgress(rows) {
              if (!rows.length) return;
              const newestOperation = rows.at(0);
              return newestOperation;
          }
          JS

          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.5.php")
          grep -q 'SYSTEM_UPDATE_MANIFEST_NO_CACHE_V180204' "$root/app/Services/SystemUpdateService.php"
          grep -q 'SYSTEM_UPDATE_PROGRESS_SELECTION_V180205' "$root/assets/app.js"
          grep -q 'NAV_RUNTIME_DEDUPE_V180204' "$root/assets/app.js"
          test "$(grep -o 'data-section="clients"' "$root/index.php" | wc -l)" -eq 1
          test "$(grep -o 'data-section="reports"' "$root/index.php" | wc -l)" -eq 1
          grep -q '/assets/app.js?v=180205' "$root/index.php"
          php -l "$root/app/Services/SystemUpdateService.php"
          php -l "$root/index.php"
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.5.php")

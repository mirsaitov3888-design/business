name: Validate LK client project context v14

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime and installer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client
          php -m | grep -q pdo_mysql
          python3 tools/system-updates/build_lk_context_v14.py
          php -l updates/installers/2026.08.02.14.php
          grep -q "const LK_CONTEXT_VERSION = '2026.08.02.14'" updates/installers/2026.08.02.14.php
          grep -q 'LK_CONTEXT_BUNDLED_V180214' updates/installers/2026.08.02.14.php

      - name: Build portal fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/lk14/data/www/seo-test.mirsaitov.pw
          mkdir -p \
            "$root/app/Core" \
            "$root/app/Services" \
            "$root/app/Repositories" \
            "$root/assets" \
            "$root/sql" \
            "$root/storage/backups"

          cat > "$root/index.php" <<'PHP'
          <?php declare(strict_types=1); ?>
          <main id="portal-root"></main>
          PHP
          sha256sum "$root/index.php" | cut -d' ' -f1 > /tmp/lk14-index.sha

          cat > "$root/assets/app.js" <<'JS'
          window.showSection = () => {};
          /* P1_SALES_BUNDLED_V180212 */
          /* P1_GOALS_BUNDLED_V180213 */
          JS
          cat > "$root/assets/app.css" <<'CSS'
          :root { --line: #ddd; --text: #111; --muted: #667; }
          /* P1_SALES_BUNDLED_V180212 */
          /* P1_GOALS_BUNDLED_V180213 */
          CSS
          printf '%s\n' '-- base schema' > "$root/sql/schema.sql"
          printf '%s\n' '<?php declare(strict_types=1);' > "$root/p1-api.php"
          printf '%s\n' '<?php declare(strict_types=1);' > "$root/p1-goals-api.php"

          cat > "$root/app/bootstrap.php" <<'PHP'
          <?php
          declare(strict_types=1);
          spl_autoload_register(static function (string $class): void {
              $prefix = 'SeoAnalytics\\';
              if (!str_starts_with($class, $prefix)) return;
              $relative = str_replace('\\', '/', substr($class, strlen($prefix)));
              $path = __DIR__ . '/' . $relative . '.php';
              if (is_file($path)) require_once $path;
          });
          PHP

          cat > "$root/app/Core/Database.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Core;
          final class Database
          {
              public static function pdo(): \PDO
              {
                  static $pdo;
                  if (!$pdo instanceof \PDO) {
                      $pdo = new \PDO(
                          'mysql:host=127.0.0.1;port=3306;dbname=portal;charset=utf8mb4',
                          'root',
                          'root',
                          [
                              \PDO::ATTR_ERRMODE => \PDO::ERRMODE_EXCEPTION,
                              \PDO::ATTR_DEFAULT_FETCH_MODE => \PDO::FETCH_ASSOC,
                          ]
                      );
                  }
                  return $pdo;
              }
          }
          PHP

          cat > "$root/app/Services/PortalAccessService.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Services;
          use SeoAnalytics\Core\Database;
          final class PortalAccessService
          {
              public static int $testUserId = 1;
              public function currentUser(): array
              {
                  $stmt = Database::pdo()->prepare(
                      'SELECT id, name, email, role, account_status FROM users WHERE id = :id'
                  );
                  $stmt->execute(['id' => self::$testUserId]);
                  $user = $stmt->fetch();
                  if (!$user) throw new \RuntimeException('User not found');
                  $user['id'] = (int) $user['id'];
                  return $user;
              }
              public function requireRoles(array $roles): array
              {
                  $user = $this->currentUser();
                  if (!in_array($user['role'], $roles, true)) {
                      throw new \RuntimeException('Denied');
                  }
                  return $user;
              }
          }
          PHP

          mysql -h127.0.0.1 -uroot -proot portal <<'SQL'
          CREATE TABLE users (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              email VARCHAR(190) NOT NULL,
              role VARCHAR(30) NOT NULL,
              account_status VARCHAR(30) NOT NULL DEFAULT 'active',
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE clients (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(255) NOT NULL,
              status VARCHAR(30) NOT NULL DEFAULT 'active',
              manager_user_id BIGINT UNSIGNED NULL,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE client_users (
              client_id BIGINT UNSIGNED NOT NULL,
              user_id BIGINT UNSIGNED NOT NULL,
              PRIMARY KEY (client_id, user_id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE projects (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              site_url VARCHAR(1000) NULL,
              goal_ids_json JSON NULL,
              active TINYINT(1) NOT NULL DEFAULT 1,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE project_client_links (
              project_id BIGINT UNSIGNED NOT NULL,
              client_id BIGINT UNSIGNED NOT NULL,
              PRIMARY KEY (project_id),
              KEY idx_project_client_client (client_id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE site_monitors (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              project_id BIGINT UNSIGNED NOT NULL,
              url VARCHAR(1000) NOT NULL,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          INSERT INTO users (id, name, email, role) VALUES
              (1, 'Admin', 'admin@example.test', 'administrator'),
              (2, 'Manager A', 'manager-a@example.test', 'manager'),
              (3, 'Client A', 'client-a@example.test', 'client'),
              (4, 'Manager B', 'manager-b@example.test', 'manager');

          INSERT INTO clients (id, name, manager_user_id) VALUES
              (10, 'Компания А', 2),
              (20, 'Компания Б', 4);

          INSERT INTO client_users (client_id, user_id) VALUES (10, 3);

          INSERT INTO projects (id, name, site_url, goal_ids_json, active) VALUES
              (101, 'Проект А1', 'https://a-main.example', JSON_ARRAY(1001, 1002), 1),
              (102, 'Проект А2', 'https://a-second.example', JSON_ARRAY(2001), 1),
              (201, 'Проект Б1', 'https://b-main.example', JSON_ARRAY(3001), 1),
              (301, 'Проект без клиента', 'https://orphan.example', JSON_ARRAY(), 1);

          INSERT INTO project_client_links (project_id, client_id) VALUES
              (101, 10),
              (102, 10),
              (201, 20);

          INSERT INTO site_monitors (project_id, url) VALUES
              (101, 'https://a-sub.example'),
              (201, 'https://b-monitor.example');
          SQL

      - name: Install twice and verify files
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/lk14/data/www/seo-test.mirsaitov.pw
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.14.php")
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.14.php")

          test "$(sha256sum "$root/index.php" | cut -d' ' -f1)" = "$(cat /tmp/lk14-index.sha)"
          test "$(grep -c 'LK_CONTEXT_BUNDLED_V180214' "$root/assets/app.js")" -eq 1
          test "$(grep -c 'LK_CONTEXT_BUNDLED_V180214' "$root/assets/app.css")" -eq 1
          grep -q 'LK_CONTEXT_V180214' "$root/assets/app.js"
          grep -q 'LK_CONTEXT_SCHEMA_V180214' "$root/sql/schema.sql"
          grep -q 'PortalContextService' "$root/p1-api.php"
          grep -q 'PortalContextService' "$root/p1-goals-api.php"
          ! grep -q 'firstActive()' "$root/p1-api.php"
          ! grep -q 'firstActive()' "$root/p1-goals-api.php"
          grep -q 'Клиентский доступ работает только на просмотр' "$root/p1-api.php"
          grep -q 'Клиентский доступ работает только на просмотр' "$root/p1-goals-api.php"

          php -l "$root/app/Services/PortalContextService.php"
          php -l "$root/portal-context-api.php"
          php -l "$root/p1-api.php"
          php -l "$root/p1-goals-api.php"
          node --check "$root/assets/app.js"

          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'project_sites'" | grep -q project_sites
          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'user_portal_context'" | grep -q user_portal_context
          test "$(mysql -N -h127.0.0.1 -uroot -proot portal -e 'SELECT COUNT(*) FROM project_sites')" -eq 6
          test "$(mysql -N -h127.0.0.1 -uroot -proot portal -e 'SELECT COUNT(*) FROM project_sites WHERE project_id = 101')" -eq 2

      - name: Test role access and project selection
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/lk14/data/www/seo-test.mirsaitov.pw
          cat > /tmp/lk14-test.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = '/tmp/lk14/data/www/seo-test.mirsaitov.pw';
          require $root . '/app/bootstrap.php';

          use SeoAnalytics\Services\PortalAccessService;
          use SeoAnalytics\Services\PortalContextDeniedException;
          use SeoAnalytics\Services\PortalContextService;

          PortalAccessService::$testUserId = 1;
          $admin = new PortalContextService(new PortalAccessService());
          $adminContext = $admin->context(10, 101, true);
          if (count($adminContext['clients']) !== 2) throw new RuntimeException('Admin clients failed');
          if (count($adminContext['all_projects']) !== 4) throw new RuntimeException('Admin projects failed');
          if ($adminContext['selected_project_id'] !== 101) throw new RuntimeException('Admin selection failed');
          if (count($adminContext['sites']) !== 2) throw new RuntimeException('Project sites failed');
          if (!$adminContext['ui']['show_client_selector']) throw new RuntimeException('Admin selector failed');

          PortalAccessService::$testUserId = 2;
          $manager = new PortalContextService(new PortalAccessService());
          $managerContext = $manager->context(10, 102, true);
          if (count($managerContext['clients']) !== 1) throw new RuntimeException('Manager clients failed');
          if (count($managerContext['all_projects']) !== 2) throw new RuntimeException('Manager projects failed');
          if ($managerContext['selected_project_id'] !== 102) throw new RuntimeException('Manager selection failed');
          try {
              $manager->requireProject(201);
              throw new RuntimeException('Manager foreign project was allowed');
          } catch (PortalContextDeniedException) {
          }

          PortalAccessService::$testUserId = 3;
          $client = new PortalContextService(new PortalAccessService());
          $clientContext = $client->context(10, 101, true);
          if (count($clientContext['clients']) !== 1) throw new RuntimeException('Client account failed');
          if (count($clientContext['all_projects']) !== 2) throw new RuntimeException('Client projects failed');
          if ($clientContext['ui']['show_client_selector']) throw new RuntimeException('Client selector must be hidden');
          if (!$clientContext['ui']['show_project_selector']) throw new RuntimeException('Client project selector missing');
          try {
              $client->requireProject(201);
              throw new RuntimeException('Client foreign project was allowed');
          } catch (PortalContextDeniedException) {
          }

          PortalAccessService::$testUserId = 4;
          $managerB = new PortalContextService(new PortalAccessService());
          $managerBContext = $managerB->context(20, 201, true);
          if (count($managerBContext['all_projects']) !== 1) throw new RuntimeException('Manager B scope failed');
          if ($managerBContext['selected_project_id'] !== 201) throw new RuntimeException('Manager B selection failed');

          $stored = (int) SeoAnalytics\Core\Database::pdo()
              ->query('SELECT COUNT(*) FROM user_portal_context')
              ->fetchColumn();
          if ($stored !== 4) throw new RuntimeException('Stored contexts failed');
          PHP
          php /tmp/lk14-test.php

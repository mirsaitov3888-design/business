name: Validate P0.5

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-sqlite3
          php -m | grep -q pdo_sqlite
          php -l updates/installers/2026.08.02.10.php
          ! grep -q 'curl_close(' updates/installers/2026.08.02.10.php

      - name: Build Bitrix24 fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p05-portal
          mkdir -p "$root/app/Services" "$root/bin" "$root/storage/backups" "$root/storage/system-audits"

          cp tools/bitrix24-step4/Bitrix24SyncService.php "$root/app/Services/Bitrix24SyncService.php"

          cat > "$root/app/Services/Bitrix24Client.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Services;

          final class Bitrix24Client
          {
              public function profile(): array
              {
                  return ['result' => ['ID' => 1, 'NAME' => 'Test']];
              }

              public function projects(): array
              {
                  return [
                      ['ID' => 77, 'NAME' => 'Client project'],
                      ['ID' => 88, 'NAME' => 'Second project'],
                  ];
              }

              public function companies(): array
              {
                  return [
                      ['id' => 10, 'title' => 'Company A'],
                      ['id' => 20, 'title' => 'Company B'],
                      ['id' => 30, 'title' => 'Company C'],
                  ];
              }

              public function tasks(int $groupId, string $tag = '', int $limit = 500): array
              {
                  return array_slice([
                      [
                          'ID' => 1,
                          'TITLE' => 'Tagged task one',
                          'GROUP_ID' => $groupId,
                          'TAGS' => ['mir saitov', 'support'],
                          'RESPONSIBLE_ID' => 10,
                      ],
                      [
                          'ID' => 2,
                          'TITLE' => 'Regular task',
                          'GROUP_ID' => $groupId,
                          'TAGS' => 'other;seo',
                          'RESPONSIBLE_ID' => 11,
                      ],
                      [
                          'ID' => 3,
                          'TITLE' => 'Tagged task two',
                          'GROUP_ID' => $groupId,
                          'TAGS' => [['name' => 'MIR SAITOV']],
                          'RESPONSIBLE_ID' => 12,
                      ],
                      [
                          'ID' => 4,
                          'TITLE' => 'Task without tags',
                          'GROUP_ID' => $groupId,
                          'TAGS' => [],
                          'RESPONSIBLE_ID' => 10,
                      ],
                  ], 0, $limit);
              }

              public function elapsedItemsBatch(array $taskIds, string $dateFrom, string $dateTo): array
              {
                  $result = [];
                  foreach ($taskIds as $taskId) {
                      $result[$taskId] = [];
                  }
                  if (isset($result[1])) {
                      $result[1][] = [
                          'ID' => 101,
                          'TASK_ID' => 1,
                          'USER_ID' => 20,
                          'SECONDS' => 600,
                      ];
                  }
                  if (isset($result[3])) {
                      $result[3][] = [
                          'ID' => 102,
                          'TASK_ID' => 3,
                          'USER_ID' => 21,
                          'MINUTES' => 5,
                      ];
                  }
                  return $result;
              }

              public function users(array $ids): array
              {
                  return array_map(
                      static fn(int $id): array => [
                          'ID' => $id,
                          'NAME' => 'User',
                          'LAST_NAME' => (string) $id,
                      ],
                      array_values(array_unique(array_map('intval', $ids)))
                  );
              }

              public function portalHost(): string
              {
                  return 'example.bitrix24.ru';
              }
          }
          PHP

          cat > "$root/app/bootstrap.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Core;

          require_once __DIR__ . '/Services/Bitrix24Client.php';

          final class Database
          {
              public static function pdo(): \PDO
              {
                  static $pdo;
                  if (!$pdo instanceof \PDO) {
                      $pdo = new \PDO('sqlite:' . dirname(__DIR__) . '/storage/test.sqlite');
                      $pdo->setAttribute(\PDO::ATTR_ERRMODE, \PDO::ERRMODE_EXCEPTION);
                  }
                  return $pdo;
              }
          }
          PHP

          php -r '
          require "/tmp/p05-portal/app/bootstrap.php";
          $pdo = SeoAnalytics\Core\Database::pdo();
          $pdo->exec("CREATE TABLE bitrix24_project_links (
            project_id INTEGER PRIMARY KEY,
            bitrix_group_id INTEGER NOT NULL,
            bitrix_group_name TEXT,
            bitrix_company_id INTEGER,
            bitrix_company_name TEXT,
            report_tag TEXT
          )");
          $pdo->exec("CREATE TABLE bitrix24_sync_runs (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            project_id INTEGER,
            date_from TEXT,
            date_to TEXT
          )");
          $pdo->exec("INSERT INTO bitrix24_project_links VALUES
            (1, 77, \"Client project\", 10, \"Company A\", \"mir saitov\")");
          $pdo->exec("INSERT INTO bitrix24_sync_runs (project_id,date_from,date_to)
            VALUES (1,\"2026-07-01\",\"2026-07-31\")");
          '

      - name: Install and verify acceptance
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p05-portal
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.10.php")

          php -l "$root/app/Services/Bitrix24SyncService.php"
          php -l "$root/app/Services/Bitrix24AcceptanceService.php"
          php -l "$root/bin/bitrix24_acceptance.php"

          grep -q 'BITRIX24_ACCEPTANCE_P05_V180210' "$root/app/Services/Bitrix24SyncService.php"
          grep -q '5000' "$root/app/Services/Bitrix24SyncService.php"
          grep -q 'mb_strtolower($taskTag)' "$root/app/Services/Bitrix24SyncService.php"

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/p05-portal/storage/system-audits/bitrix24-acceptance-latest.json').read_text(encoding='utf-8'))
          assert report['status'] == 'ok', report
          assert report['profile_ok'] is True
          assert report['portal_host'] == 'example.bitrix24.ru'
          assert report['counts']['projects'] == 2
          assert report['counts']['companies'] == 3
          assert report['counts']['linked_projects'] == 1
          assert report['counts']['tasks'] == 4
          assert report['counts']['tagged_tasks'] == 2
          assert report['counts']['elapsed_sampled_tasks'] == 4
          assert report['counts']['elapsed_entries'] == 2
          assert report['counts']['elapsed_seconds'] == 900
          assert report['counts']['users'] == 5
          assert report['links'][0]['period']['source'] == 'last_sync'
          assert report['links'][0]['elapsed_api_verified'] is True
          assert report['errors'] == []
          assert report['warnings'] == []
          PY

          (cd "$root" && php bin/bitrix24_acceptance.php >/tmp/p05-acceptance.json)
          python3 -m json.tool /tmp/p05-acceptance.json >/dev/null

          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.10.php")
          test -e "$root/storage/system-audits/bitrix24-acceptance-latest.json"

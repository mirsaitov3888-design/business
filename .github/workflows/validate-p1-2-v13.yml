name: Validate P1.2 v13

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime and installer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client
          php -m | grep -q pdo_mysql
          python3 tools/system-updates/prepare_p1_2_v13.py
          python3 tools/system-updates/build_p1_2.py
          php -l updates/installers/2026.08.02.13.php
          grep -q "const P12_VERSION = '2026.08.02.13'" updates/installers/2026.08.02.13.php
          grep -q 'P1_GOALS_BUNDLED_V180213' updates/installers/2026.08.02.13.php
          ! grep -q 'P1_GOALS_ASSETS_V180212' updates/installers/2026.08.02.13.php

      - name: Build current P1.1 fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p13/data/www/seo-test.mirsaitov.pw
          mkdir -p "$root/app/Core" "$root/app/Repositories" "$root/app/Services" "$root/assets" "$root/sql" "$root/storage/backups"

          cat > "$root/index.php" <<'PHP'
          <?php declare(strict_types=1); ?>
          <main id="portal-root"></main>
          PHP
          printf '%s\n' 'window.showSection = () => {};' '/* P1_SALES_BUNDLED_V180212 */' '/* P1_SALES_V180211 */' > "$root/assets/app.js"
          printf '%s\n' ':root { --line: #ddd; --text: #111; --muted: #667; }' '/* P1_SALES_BUNDLED_V180212 */' '/* P1_SALES_V180211 */' > "$root/assets/app.css"
          printf '%s\n' '-- P1_SALES_SCHEMA_V180211' > "$root/sql/schema.sql"
          printf '%s\n' '<?php declare(strict_types=1);' > "$root/p1-api.php"
          sha256sum "$root/index.php" | cut -d' ' -f1 > /tmp/p13-index.sha

          cat > "$root/app/bootstrap.php" <<'PHP'
          <?php
          declare(strict_types=1);
          spl_autoload_register(static function (string $class): void {
              $prefix = 'SeoAnalytics\\';
              if (!str_starts_with($class, $prefix)) return;
              $relative = str_replace('\\', '/', substr($class, strlen($prefix)));
              $path = __DIR__ . '/' . $relative . '.php';
              if (is_file($path)) require_once $path;
          });
          PHP

          cat > "$root/app/Core/Database.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Core;
          final class Database
          {
              public static function pdo(): \PDO
              {
                  static $pdo;
                  if (!$pdo instanceof \PDO) {
                      $pdo = new \PDO(
                          'mysql:host=127.0.0.1;port=3306;dbname=portal;charset=utf8mb4',
                          'root',
                          'root',
                          [\PDO::ATTR_ERRMODE => \PDO::ERRMODE_EXCEPTION]
                      );
                  }
                  return $pdo;
              }
          }
          PHP

          cat > "$root/app/Services/PortalAccessService.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Services;
          final class PortalAccessService
          {
              public function requireRoles(array $roles): array
              {
                  return ['id' => 1, 'role' => 'administrator'];
              }
          }
          PHP

          cat > "$root/app/Repositories/ProjectRepository.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace SeoAnalytics\Repositories;
          final class ProjectRepository
          {
              public function firstActive(): ?array
              {
                  return ['id' => 1, 'name' => 'Тестовый проект'];
              }
          }
          PHP

          mysql -h127.0.0.1 -uroot -proot portal <<'SQL'
          CREATE TABLE users (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              email VARCHAR(190) NOT NULL,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE projects (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              name VARCHAR(190) NOT NULL,
              active TINYINT(1) NOT NULL DEFAULT 1,
              goal_ids_json JSON NULL,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE sales_records (
              id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
              project_id BIGINT UNSIGNED NOT NULL,
              fingerprint CHAR(64) NOT NULL,
              PRIMARY KEY (id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT INTO users (name, email) VALUES ('Admin', 'admin@example.test');
          INSERT INTO projects (name, active, goal_ids_json) VALUES (
              'Тестовый проект',
              1,
              JSON_ARRAY(
                  JSON_OBJECT('id', 101, 'name', 'Отправка формы'),
                  202,
                  JSON_OBJECT('goal_id', '303', 'title', 'Клик по телефону')
              )
          );
          SQL

      - name: Install and verify P1.2
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p13/data/www/seo-test.mirsaitov.pw
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.13.php")

          test "$(sha256sum "$root/index.php" | cut -d' ' -f1)" = "$(cat /tmp/p13-index.sha)"
          test "$(grep -c 'P1_GOALS_BUNDLED_V180213' "$root/assets/app.js")" -eq 1
          test "$(grep -c 'P1_GOALS_BUNDLED_V180213' "$root/assets/app.css")" -eq 1
          grep -q 'P1_GOALS_V180213' "$root/assets/app.js"
          grep -q 'P1_GOALS_V180213' "$root/assets/app.css"
          grep -q 'P1_GOALS_SCHEMA_V180213' "$root/sql/schema.sql"
          test -f "$root/app/Repositories/ConversionGoalRepository.php"
          test -f "$root/p1-goals-api.php"
          test -f "$root/assets/p1-goals.js"
          test -f "$root/assets/p1-goals.css"
          php -l "$root/app/Repositories/ConversionGoalRepository.php"
          php -l "$root/p1-goals-api.php"
          node --check "$root/assets/app.js"
          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'conversion_goals'" | grep -q conversion_goals
          mysql -N -h127.0.0.1 -uroot -proot portal -e "SHOW TABLES LIKE 'conversion_goal_changes'" | grep -q conversion_goal_changes

      - name: Test goal classification and repeat installation
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p13/data/www/seo-test.mirsaitov.pw
          cat > /tmp/p13-test.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = '/tmp/p13/data/www/seo-test.mirsaitov.pw';
          require $root . '/app/bootstrap.php';
          require_once $root . '/app/Repositories/ConversionGoalRepository.php';

          $repository = new SeoAnalytics\Repositories\ConversionGoalRepository();
          $sync = $repository->syncProjectGoals(1, 1);
          if ($sync['found'] !== 3 || $sync['created'] !== 3) {
              throw new RuntimeException('Project goal sync failed');
          }

          $manualId = $repository->save([
              'source_system' => 'manual',
              'external_id' => 'manual-order',
              'name' => 'Заказ консультации',
              'classification' => 'lead',
              'active' => true,
              'notes' => 'Основная заявка',
          ], 1, 1);
          if ($manualId <= 0) throw new RuntimeException('Manual goal save failed');

          $goals = $repository->list(1, true);
          $metrika101 = null;
          foreach ($goals as $goal) {
              if ($goal['source_system'] === 'metrika' && $goal['external_id'] === '101') {
                  $metrika101 = $goal;
                  break;
              }
          }
          if (!$metrika101) throw new RuntimeException('Synced goal not found');
          $repository->save([
              ...$metrika101,
              'classification' => 'assisted',
              'active' => true,
          ], 1, 1);
          $repeat = $repository->syncProjectGoals(1, 1);
          if ($repeat['created'] !== 0 || $repeat['updated'] !== 3) {
              throw new RuntimeException('Repeat sync failed');
          }
          $stored = $repository->find((int) $metrika101['id'], 1);
          if (($stored['classification'] ?? '') !== 'assisted') {
              throw new RuntimeException('Classification was overwritten');
          }
          $counts = $repository->counts(1);
          if ($counts['total'] !== 4 || $counts['lead'] !== 1 || $counts['assisted'] !== 1 || $counts['unclassified'] !== 2) {
              throw new RuntimeException('Counts failed');
          }
          if (!$repository->delete($manualId, 1, 1)) {
              throw new RuntimeException('Delete failed');
          }
          $deletedAudit = (int) SeoAnalytics\Core\Database::pdo()
              ->query("SELECT COUNT(*) FROM conversion_goal_changes WHERE action_key = 'deleted' AND goal_id = {$manualId}")
              ->fetchColumn();
          if ($deletedAudit !== 1) {
              throw new RuntimeException('Deleted goal audit missing');
          }
          PHP
          php /tmp/p13-test.php

          before="$(mysql -N -h127.0.0.1 -uroot -proot portal -e 'SELECT COUNT(*) FROM conversion_goals')"
          (cd "$root" && php "$GITHUB_WORKSPACE/updates/installers/2026.08.02.13.php")
          after="$(mysql -N -h127.0.0.1 -uroot -proot portal -e 'SELECT COUNT(*) FROM conversion_goals')"
          test "$before" -eq "$after"
          test "$(grep -c 'P1_GOALS_BUNDLED_V180213' "$root/assets/app.js")" -eq 1
          test "$(grep -c 'P1_GOALS_BUNDLED_V180213' "$root/assets/app.css")" -eq 1
          test "$(grep -c 'P1_GOALS_SCHEMA_V180213' "$root/sql/schema.sql")" -eq 1

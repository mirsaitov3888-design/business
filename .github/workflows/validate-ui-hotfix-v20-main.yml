name: Validate portal UI hotfix v20 from main

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.head_ref == 'hotfix/ui-modal-cache-v20'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/ui-modal-cache-v20

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql mysql-client jq
          php -m | grep -q pdo_mysql

      - name: Run UI hotfix integration
        shell: bash
        run: bash tools/ui-hotfix-v20/run_ci.sh
